ill="#8b754c" stroke="#8b754c" stroke-width="1.2"/><path d="M302 600L400 556L414 556" fill="none" stroke="#8b754c" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="560" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="14">器身</text><text x="420" y="578" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">整件器物保存已塑形的</text><text x="420" y="596" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">魔力与塑形方式</text><circle cx="190" cy="800" r="2.6" fill="#8b754c" stroke="#8b754c" stroke-width="1.2"/><path d="M190 800L130 696L116 696" fill="none" stroke="#8b754c" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="700" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="14" text-anchor="end">底座</text><text x="110" y="720" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11" text-anchor="end">主人会把它从</text><text x="110" y="736" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11" text-anchor="end">书桌搬到柜台</text><text x="290" y="870" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="12" text-anchor="middle">正面形制（示意）</text><text x="60" y="920" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="12">巫师造物：属于安全范畴，可在市场上自由流通。</text><text x="60" y="940" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="12">本件是据造物性质拟写的生活样本。</text><circle cx="612" cy="180" r="10" fill="none" stroke="#8b754c" stroke-width="1"/><text x="612" y="184" fill="#8b754c" font-family="Georgia,'Times New Roman',serif" font-size="11" text-anchor="middle">1</text><text x="632" y="185" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="15">造物与蕴法石</text><text x="632" y="203" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">保存的东西不同</text><path d="M632 230L850 230" fill="none" stroke="#d9d3bd" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="636" y="222" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11"></text><text x="700" y="222" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">造物</text><text x="785" y="222" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">蕴法石</text><path d="M632 256L850 256" fill="none" stroke="#d9d3bd" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="636" y="248" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">保存</text><text x="700" y="248" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">已塑形的魔力</text><text x="785" y="248" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">完整的咒语</text><path d="M632 282L850 282" fill="none" stroke="#d9d3bd" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="636" y="274" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">效果</text><text x="700" y="274" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">可重复使用</text><text x="785" y="274" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">单次释放</text><path d="M632 308L850 308" fill="none" stroke="#d9d3bd" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="636" y="300" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">用过以后</text><text x="700" y="300" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">慢慢自然恢复</text><text x="785" y="300" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">不能再填</text><circle cx="612" cy="360" r="10" fill="none" stroke="#8b754c" stroke-width="1"/><text x="612" y="364" fill="#8b754c" font-family="Georgia,'Times New Roman',serif" font-size="11" text-anchor="middle">2</text><text x="632" y="365" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="15">契合度</text><text x="632" y="383" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">同一盏灯，在不同人手里</text><circle cx="665" cy="420" r="10" fill="#f3e3b0" stroke="#b89c66" stroke-width="1.2"/><circle cx="665" cy="420" r="30.9" fill="none" stroke="#b89c66" stroke-width="0.7" stroke-dasharray="2 3"/><path d="M655 470q10 -12 20 0" fill="none" stroke="#4a5a49" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M665 458L665 446" fill="none" stroke="#4a5a49" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="737" cy="420" r="10" fill="#f3e3b0" stroke="#b89c66" stroke-width="1.2"/><circle cx="737" cy="420" r="24.3" fill="none" stroke="#b89c66" stroke-width="0.7" stroke-dasharray="2 3"/><path d="M727 470q10 -12 20 0" fill="none" stroke="#4a5a49" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M737 458L737 446" fill="none" stroke="#4a5a49" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="809" cy="420" r="10" fill="#f3e3b0" stroke="#b89c66" stroke-width="1.2"/><circle cx="809" cy="420" r="18.4" fill="none" stroke="#b89c66" stroke-width="0.7" stroke-dasharray="2 3"/><path d="M799 470q10 -12 20 0" fill="none" stroke="#4a5a49" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M809 458L809 446" fill="none" stroke="#4a5a49" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="632" y="500" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">材料、灌注时的魔力流与使用者的回路特性</text><text x="632" y="516" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">共同决定能效；没有魔力的人也能使用。</text><circle cx="612" cy="570" r="10" fill="none" stroke="#8b754c" stroke-width="1"/><text x="612" y="574" fill="#8b754c" font-family="Georgia,'Times New Roman',serif" font-size="11" text-anchor="middle">3</text><text x="632" y="575" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="15">慢慢恢复</text><text x="632" y="593" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">从自然魔力中缓慢提取</text><path d="M640 680L845 680" fill="none" stroke="#a3a089" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 680L640 610" fill="none" stroke="#a3a089" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M640 615L700 618L716 668L760 650L800 632L845 622" fill="none" stroke="#8b754c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="690" y="700" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="10" text-anchor="middle">使用</text><text x="790" y="700" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="10" text-anchor="middle">等待恢复</text><text x="606" y="640" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="10">储备</text><text x="632" y="724" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">只示意趋势，不标时间。</text><circle cx="612" cy="780" r="10" fill="none" stroke="#8b754c" stroke-width="1"/><text x="612" y="784" fill="#8b754c" font-family="Georgia,'Times New Roman',serif" font-size="11" text-anchor="middle">4</text><text x="632" y="785" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="15">人为补充的条件</text><text x="632" y="803" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">通常只有原灌注者能做到</text><text x="640" y="828" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="12">一  必须是初步塑形的魔力</text><text x="640" y="852" fill="#263f32" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="12">二  魔力流与造物内部一致</text><text x="632" y="884" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">日用器物的主人多半靠自然恢复，</text><text x="632" y="900" fill="#596554" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" font-size="11">在使用与等待之间安排工作。</text></svg>